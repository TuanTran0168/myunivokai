# Render blueprint for the Myunivokai service fleet.
# Secrets are `sync: false`: their values live ONLY in the Render dashboard
# except the gateway credential, which Render generates once in the shared
# environment group below.
# The web client deploys separately (Vercel per README, or a Render static site)
# with NEXT_PUBLIC_API_BASE_URL pointing at the gateway's /api/universe prefix.
envVarGroups:
  - name: myunivokai-gateway-secrets
    envVars:
      - key: GATEWAY_SHARED_SECRET
        generateValue: true

services:
  - type: web
    name: myunivokai-gateway
    runtime: docker
    rootDir: services/api-gateway
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: API_ALLOWED_ORIGINS
        sync: false
      # Free Render web services cannot receive private-network requests.
      # Public HTTPS upstream URLs plus the shared key prevent bypass.
      - key: UNIVERSE_SERVICE_URL
        sync: false
      - key: NATURE_SERVICE_URL
        sync: false
      - fromGroup: myunivokai-gateway-secrets

  - type: web
    name: myunivokai-api
    runtime: docker
    rootDir: services/universe-service
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - fromGroup: myunivokai-gateway-secrets
      # mock needs no key; switch to gemini/openai in the dashboard when a real
      # key is configured.
      - key: AI_PROVIDER
        value: mock
      - key: AI_FALLBACK_PROVIDER
        value: mock
      # Neon POOLED url (runtime) and DIRECT url (migrations), sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  # nature-service: the forest world API, a full peer of myunivokai-api.
  # Its DATABASE_URL/DATABASE_DIRECT_URL must point at nature-service's OWN
  # logical database (e.g. myunivokai_nature) created inside the SAME Neon
  # project as the universe database — a second database costs nothing and
  # keeps the deployed universe data out of this service's blast radius.
  - type: web
    name: myunivokai-nature
    runtime: docker
    rootDir: services/nature-service
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /api/v1/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - fromGroup: myunivokai-gateway-secrets
      # mock is the only wired provider until the real-AI round.
      - key: AI_PROVIDER
        value: mock
      - key: AI_FALLBACK_PROVIDER
        value: mock
      # Neon POOLED url (runtime) and DIRECT url (migrations) of the dedicated
      # nature database, sslmode=require.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
