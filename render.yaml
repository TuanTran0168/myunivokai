# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Managed NATS, Redis, and three Neon URLs are supplied through the dashboard.
# Domain names describe responsibilities; Render's `worker` type describes the process.
services:
# =============================================================================
# Note: The web frontend (myunivokai-web) is hosted on Vercel.
# Render does not need to deploy or manage this service.
# =============================================================================
#  - type: web
#    name: myunivokai-web
#    runtime: docker
#    dockerfilePath: ./apps/myunivokai-web/Dockerfile.prod
#    dockerContext: ./apps/myunivokai-web
#    plan: free
#    autoDeployTrigger: checksPass
#    healthCheckPath: /
#    envVars:
#      - key: NEXT_PUBLIC_GATEWAY_BASE_URL
#        sync: false

  - type: web
    name: myunivokai-gateway
    runtime: docker
    dockerfilePath: ./services/api-gateway/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
#    healthCheckPath: /api/v1/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: API_ALLOWED_ORIGINS
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_REQUEST_TIMEOUT
        value: 3s
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: myunivokai
      - key: RATE_LIMIT_REQUESTS_PER_SECOND
        value: "2"
      - key: RATE_LIMIT_BURST
        value: "20"
      - key: JOB_CACHE_TTL
        value: 30s
      - key: WORLD_CACHE_TTL
        value: 60s
      - key: SHARE_CACHE_TTL
        value: 60s

  - type: web
    name: myunivokai-dna
    runtime: docker
    dockerfilePath: ./services/dna-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    preDeployCommand: /app/migrate
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_ACK_WAIT
        value: 2m
      - key: NATS_MAX_DELIVER
        value: "5"
      - key: NATS_FETCH_BATCH_SIZE
        value: "1"
      - key: NATS_FETCH_MAX_WAIT
        value: 1s
      - key: NATS_RETRY_DELAY
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: OUTBOX_POLL_INTERVAL
        value: 500ms
      - key: OUTBOX_BATCH_SIZE
        value: "50"
      - key: AI_PROVIDER
        value: mock
      - key: AI_FALLBACK_PROVIDER
        value: mock
      - key: AI_ENABLE_FALLBACK
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: myunivokai-universe
    runtime: docker
    dockerfilePath: ./services/universe-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    preDeployCommand: /app/migrate
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_ACK_WAIT
        value: 2m
      - key: NATS_MAX_DELIVER
        value: "5"
      - key: NATS_FETCH_BATCH_SIZE
        value: "1"
      - key: NATS_FETCH_MAX_WAIT
        value: 1s
      - key: NATS_RETRY_DELAY
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: OUTBOX_POLL_INTERVAL
        value: 500ms
      - key: OUTBOX_BATCH_SIZE
        value: "50"
      - key: PUBLIC_WEB_URL
        sync: false

  - type: web
    name: myunivokai-nature
    runtime: docker
    dockerfilePath: ./services/nature-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    preDeployCommand: /app/migrate
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_ACK_WAIT
        value: 2m
      - key: NATS_MAX_DELIVER
        value: "5"
      - key: NATS_FETCH_BATCH_SIZE
        value: "1"
      - key: NATS_FETCH_MAX_WAIT
        value: 1s
      - key: NATS_RETRY_DELAY
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: OUTBOX_POLL_INTERVAL
        value: 500ms
      - key: OUTBOX_BATCH_SIZE
        value: "50"
      - key: PUBLIC_WEB_URL
        sync: false
