# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Managed NATS, Redis, and four Neon URLs are supplied through the dashboard.
# Domain names describe responsibilities; Render's `worker` type describes the process.
services:
# =============================================================================
# Note: The web frontend (myunivokai-web) is hosted on Vercel.
# Render does not need to deploy or manage this service.
# =============================================================================
#  - type: web
#    name: myunivokai-web
#    runtime: docker
#    dockerfilePath: ./apps/myunivokai-web/Dockerfile.prod
#    dockerContext: ./apps/myunivokai-web
#    plan: free
#    autoDeployTrigger: checksPass
#    healthCheckPath: /
#    envVars:
#      - key: NEXT_PUBLIC_GATEWAY_BASE_URL
#        sync: false

  - type: web
    name: myunivokai-gateway
    runtime: docker
    dockerfilePath: ./services/api-gateway/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
#    healthCheckPath: /api/v1/healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: API_ALLOWED_ORIGINS
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_REQUEST_TIMEOUT
        value: 3s
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: myunivokai
      - key: RATE_LIMIT_REQUESTS_PER_SECOND
        value: "2"
      - key: RATE_LIMIT_BURST
        value: "20"
      - key: JOB_CACHE_TTL
        value: 30s
      - key: WORLD_CACHE_TTL
        value: 60s
      - key: SHARE_CACHE_TTL
        value: 60s
      # Off until apps/myunivokai-admin exists (S4-AUTH-004) and
      # ADMIN_ALLOWED_ORIGIN is filled in below — flipping this to "true"
      # with an empty/wildcard origin fails config validation and the whole
      # gateway (product routes included) refuses to start. See
      # notes/vision/auth-and-admin-plan.md#amended--one-gateway-two-route-groups.
      - key: ADMIN_ROUTES_ENABLED
        value: "false"
      - key: ADMIN_ALLOWED_ORIGIN
        sync: false
      - key: ADMIN_RATE_LIMIT_REQUESTS_PER_SECOND
        value: "2"
      - key: ADMIN_RATE_LIMIT_BURST
        value: "20"

  - type: web
    name: myunivokai-dna
    runtime: docker
    dockerfilePath: ./services/dna-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_ACK_WAIT
        value: 2m
      - key: NATS_MAX_DELIVER
        value: "5"
      - key: NATS_FETCH_BATCH_SIZE
        value: "1"
      - key: NATS_FETCH_MAX_WAIT
        value: 1s
      - key: NATS_RETRY_DELAY
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: OUTBOX_POLL_INTERVAL
        value: 500ms
      - key: OUTBOX_BATCH_SIZE
        value: "50"
      - key: AI_PROVIDER
        value: mock
      - key: AI_FALLBACK_PROVIDER
        value: mock
      - key: AI_ENABLE_FALLBACK
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: myunivokai-universe
    runtime: docker
    dockerfilePath: ./services/universe-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_ACK_WAIT
        value: 2m
      - key: NATS_MAX_DELIVER
        value: "5"
      - key: NATS_FETCH_BATCH_SIZE
        value: "1"
      - key: NATS_FETCH_MAX_WAIT
        value: 1s
      - key: NATS_RETRY_DELAY
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: OUTBOX_POLL_INTERVAL
        value: 500ms
      - key: OUTBOX_BATCH_SIZE
        value: "50"
      - key: PUBLIC_WEB_URL
        sync: false

  - type: web
    name: myunivokai-auth
    runtime: docker
    dockerfilePath: ./services/auth-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: myunivokai
      # Ed25519 seed, base64-encoded — generate ONE PER ENVIRONMENT
      # (`openssl rand -base64 32`), never reuse the local-dev value, never
      # put a real value in this file. Rotation: add a second key to the
      # gateway's accepted-public-keys list before removing the old one, so
      # no session is force-logged-out — see
      # notes/vision/auth-and-admin-plan.md#tokens.
      - key: AUTH_ACCESS_PRIVATE_KEY
        sync: false
      - key: AUTH_ACCESS_TOKEN_TTL
        value: 10m
      - key: AUTH_REFRESH_TOKEN_TTL
        value: 336h
      - key: AUTH_TOKEN_VERSION_CACHE_TTL
        value: 360h
      - key: AUTH_ARGON2_MEMORY_KIB
        value: "19456"
      - key: AUTH_ARGON2_ITERATIONS
        value: "2"
      - key: AUTH_ARGON2_PARALLELISM
        value: "1"
      - key: AUTH_ARGON2_SALT_LENGTH
        value: "16"
      - key: AUTH_ARGON2_KEY_LENGTH
        value: "32"
      - key: AUTH_MAX_FAILED_ATTEMPTS
        value: "5"
      - key: AUTH_LOCKOUT_DURATION
        value: 15m

  - type: web
    name: myunivokai-nature
    runtime: docker
    dockerfilePath: ./services/nature-service/Dockerfile.prod
    dockerContext: .
    plan: free
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATIONS_DIR
        value: /app/migrations
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_DIRECT_URL
        sync: false
      - key: NATS_URL
        sync: false
      - key: NATS_USERNAME
        sync: false
      - key: NATS_PASSWORD
        sync: false
      - key: NATS_CONNECT_TIMEOUT
        value: 5s
      - key: NATS_RECONNECT_WAIT
        value: 2s
      - key: NATS_PUBLISH_TIMEOUT
        value: 5s
      - key: NATS_ACK_WAIT
        value: 2m
      - key: NATS_MAX_DELIVER
        value: "5"
      - key: NATS_FETCH_BATCH_SIZE
        value: "1"
      - key: NATS_FETCH_MAX_WAIT
        value: 1s
      - key: NATS_RETRY_DELAY
        value: 2s
      - key: NATS_QUERY_TIMEOUT
        value: 2500ms
      - key: OUTBOX_POLL_INTERVAL
        value: 500ms
      - key: OUTBOX_BATCH_SIZE
        value: "50"
      - key: PUBLIC_WEB_URL
        sync: false
