server_name: myunivokai-local-nats
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 2GB
}

authorization {
  users: [
    {
      user: $NATS_BOOTSTRAP_USERNAME
      password: $NATS_BOOTSTRAP_PASSWORD
      permissions: { publish: ">", subscribe: ">" }
    },
    {
      user: $NATS_GATEWAY_USERNAME
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        # "myunivokai.queries.>" already covers myunivokai.queries.auth.>, so
        # the /api/admin route group (S4-AUTH-003) needed no new publish
        # permission here — do not narrow this to per-domain query subjects
        # without adding auth.> back explicitly.
        publish: ["$JS.API.>", "myunivokai.commands.dna.generate.v1", "myunivokai.queries.>"]
        subscribe: ["_INBOX.>"]
      }
    },
    {
      user: $NATS_DNA_USERNAME
      password: $NATS_DNA_PASSWORD
      permissions: {
        publish: ["$JS.API.>", "_INBOX.>", "myunivokai.commands.universe.compose.v1", "myunivokai.commands.nature.compose.v1", "myunivokai.events.dna.>"]
        subscribe: ["_INBOX.>", "myunivokai.commands.dna.generate.v1", "myunivokai.events.universe.>", "myunivokai.events.nature.>", "myunivokai.queries.dna.>"]
      }
    },
    {
      user: $NATS_UNIVERSE_USERNAME
      password: $NATS_UNIVERSE_PASSWORD
      permissions: {
        publish: ["$JS.API.>", "_INBOX.>", "myunivokai.events.universe.>"]
        subscribe: ["_INBOX.>", "myunivokai.commands.universe.compose.v1", "myunivokai.queries.universe.>"]
      }
    },
    {
      user: $NATS_NATURE_USERNAME
      password: $NATS_NATURE_PASSWORD
      permissions: {
        publish: ["$JS.API.>", "_INBOX.>", "myunivokai.events.nature.>"]
        subscribe: ["_INBOX.>", "myunivokai.commands.nature.compose.v1", "myunivokai.queries.nature.>"]
      }
    },
    {
      user: $NATS_AUTH_USERNAME
      password: $NATS_AUTH_PASSWORD
      permissions: {
        # auth-service is a pure Core NATS request-reply worker: no JetStream
        # command to pull and no domain event to publish, so it needs neither
        # $JS.API.> nor an events.> publish permission that every other
        # domain service has.
        publish: ["_INBOX.>"]
        subscribe: ["_INBOX.>", "myunivokai.queries.auth.>"]
      }
    }
  ]
}
