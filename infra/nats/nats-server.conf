# LOCAL DEVELOPMENT ONLY. Production connects to Synadia Cloud with a single
# nats.creds account user shared by every service and no per-user publish
# allow-list, so the permissions below are the only place they are enforced —
# see notes/ops/production-deployment-guide.md.
server_name: myunivokai-local-nats
port: 4222
http_port: 8222

jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 256MB
  max_file_store: 2GB
}

authorization {
  users: [
    {
      user: $NATS_BOOTSTRAP_USERNAME
      password: $NATS_BOOTSTRAP_PASSWORD
      permissions: { publish: ">", subscribe: ">" }
    },
    {
      user: $NATS_GATEWAY_USERNAME
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        # "myunivokai.queries.>" already covers myunivokai.queries.auth.>, so
        # the /api/admin route group (S4-AUTH-003) needed no new publish
        # permission here — do not narrow this to per-domain query subjects
        # without adding auth.> back explicitly.
        publish: ["$JS.API.>", "myunivokai.commands.dna.generate.v1", "myunivokai.queries.>"]
        subscribe: ["_INBOX.>"]
      }
    },
    {
      user: $NATS_DNA_USERNAME
      password: $NATS_DNA_PASSWORD
      permissions: {
        publish: ["$JS.API.>", "$JS.ACK.>", "_INBOX.>", "myunivokai.commands.universe.compose.v1", "myunivokai.commands.nature.compose.v1", "myunivokai.events.dna.>"]
        subscribe: ["_INBOX.>", "myunivokai.commands.dna.generate.v1", "myunivokai.events.universe.>", "myunivokai.events.nature.>", "myunivokai.queries.dna.>"]
      }
    },
    {
      user: $NATS_UNIVERSE_USERNAME
      password: $NATS_UNIVERSE_PASSWORD
      permissions: {
        publish: ["$JS.API.>", "$JS.ACK.>", "_INBOX.>", "myunivokai.events.universe.>"]
        subscribe: ["_INBOX.>", "myunivokai.commands.universe.compose.v1", "myunivokai.queries.universe.>"]
      }
    },
    {
      user: $NATS_NATURE_USERNAME
      password: $NATS_NATURE_PASSWORD
      permissions: {
        publish: ["$JS.API.>", "$JS.ACK.>", "_INBOX.>", "myunivokai.events.nature.>"]
        subscribe: ["_INBOX.>", "myunivokai.commands.nature.compose.v1", "myunivokai.queries.nature.>"]
      }
    },
    {
      user: $NATS_AUTH_USERNAME
      password: $NATS_AUTH_PASSWORD
      permissions: {
        # auth-service is a pure Core NATS request-reply worker: no JetStream
        # command to pull and no domain event to publish, so it needs neither
        # $JS.API.> nor an events.> publish permission that every other
        # domain service has.
        publish: ["_INBOX.>"]
        subscribe: ["_INBOX.>", "myunivokai.queries.auth.>"]
      }
    },
    {
      user: $NATS_ANALYTICS_USERNAME
      password: $NATS_ANALYTICS_PASSWORD
      permissions: {
        # The only user that subscribes to myunivokai.events.> as a wildcard,
        # and the only one that may publish no domain subject at all. That
        # asymmetry is deliberate: analytics-service consumes events, writes
        # its own database and answers queries — the ACL enforces the
        # read-model rule rather than trusting the code to honour it. Adding
        # any myunivokai.* publish permission here would be a design
        # violation, not a convenience. $JS.API.> is needed for its durable
        # JetStream consumer, $JS.ACK.> to acknowledge a delivery (an ack is
        # a publish to a reply subject under that prefix, NOT under
        # $JS.API.> — every consuming user here needs both, and a missing
        # $JS.ACK.> shows up as an endless redelivery loop rather than an
        # error at startup), and _INBOX.> is how a request/reply answer is
        # sent back to whoever asked.
        publish: ["$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
        subscribe: ["_INBOX.>", "myunivokai.events.>", "myunivokai.queries.analytics.>"]
      }
    }
  ]
}
