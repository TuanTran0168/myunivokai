  github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldListResponse:
    properties:
      worlds:
        items:
          $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldResponse'
        type: array
    type: object
  github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldResponse:
    properties:
      personalityDNA:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.PersonalityDNA'
      selectedVariant:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldVariant'
      variants:
        items:
          $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldVariant'
        type: array
      world:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.World'
    type: object
  github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldSceneConfig:
    properties:
      archetype:
        type: string
      belt:
        allOf:
        - $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.BeltConfig'
        description: |-
          Belt, Comets and Sun were added in schemaVersion 1.2 (the scene diversity
          round). Pointer + omitempty like Sky: configs stored before 1.2 have no
          keys and the frontend renders its built-in defaults, so old worlds keep
          looking exactly as they did.
      camera:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.CameraConfig'
      comets:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.CometsConfig'
      core:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.CoreConfig'
      hud:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.HUDConfig'
      palette:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.Palette'
      particles:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.ParticleConfig'
      planets:
        items:
          $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.PlanetSceneConfig'
        type: array
      postFX:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.PostFXConfig'
      quote:
        type: string
      sceneName:
        type: string
      schemaVersion:
        type: string
      sky:
        allOf:
        - $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.SkyConfig'
        description: |-
          Sky was added in schemaVersion 1.1. Pointer + omitempty so configs stored
          before that keep round-tripping without a sky key; the frontend falls back
          to its built-in sky defaults when the key is absent.
      sun:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.SunConfig'
      theme:
        type: string
    type: object
  github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldVariant:
    properties:
      config:
        $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldSceneConfig'
      createdAt:
        type: string
      id:
        type: string
      isSelected:
        type: boolean
      seed:
        type: string
      thumbnailUrl:
        type: string
      variantNo:
        type: integer
      worldId:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for Myunivokai personal universe generation.
  title: Myunivokai API
  version: 0.1.0
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check (liveness)
      tags:
      - health
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Readiness check (dependencies)
      tags:
      - health
  /share/worlds/{shareSlug}:
    get:
      parameters:
      - description: Share slug
        in: path
        name: shareSlug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.PublicWorldResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
      summary: Get public universe
      tags:
      - share
  /worlds:
    get:
      parameters:
      - description: Comma-separated world IDs (max 50)
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
      summary: Get universes by ids
      tags:
      - worlds
    post:
      consumes:
      - application/json
      parameters:
      - description: World input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.CreateWorldResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
      summary: Create universe
      tags:
      - worlds
  /worlds/{worldId}:
    get:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.WorldResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
      summary: Get universe
      tags:
      - worlds
  /worlds/{worldId}/publish:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.PublishResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
      summary: Publish universe
      tags:
      - worlds
  /worlds/{worldId}/variants:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.VariantResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
      summary: Regenerate universe variant
      tags:
      - worlds
  /worlds/{worldId}/variants/{variantId}/select:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      - description: Variant ID
        in: path
        name: variantId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_models.VariantResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_universe-service_internal_httpx.ErrorEnvelope'
      summary: Select universe variant
      tags:
      - worlds
swagger: "2.0"
