basePath: /api/v1
definitions:
  httpx.ErrorBody:
    properties:
      code:
        type: string
      details:
        items:
          $ref: '#/definitions/httpx.ErrorDetail'
        type: array
      message:
        type: string
      requestId:
        type: string
    type: object
  httpx.ErrorDetail:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  httpx.ErrorEnvelope:
    properties:
      error:
        $ref: '#/definitions/httpx.ErrorBody'
    type: object
  models.CameraConfig:
    properties:
      distance:
        type: number
      fov:
        type: number
    type: object
  models.ConstellationConfig:
    properties:
      displayCount:
        type: integer
      glowMultiplier:
        type: number
      lineColor:
        type: string
      rotationRadiansPerSecond:
        type: number
      seed:
        type: string
      starColor:
        type: string
    type: object
  models.CoreConfig:
    properties:
      color:
        type: string
      emissive:
        type: string
      scale:
        type: number
      shape:
        type: string
      spinSpeed:
        type: number
    type: object
  models.CreateWorldResponse:
    properties:
      personalityDNA:
        $ref: '#/definitions/models.PersonalityDNA'
      variant:
        $ref: '#/definitions/models.WorldVariant'
      world:
        $ref: '#/definitions/models.World'
    type: object
  models.DNAPlanet:
    properties:
      energy:
        type: integer
      key:
        type: string
      meaning:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  models.EnergySignature:
    properties:
      intensity:
        type: integer
      primary:
        type: string
      secondary:
        type: string
    type: object
  models.HUDConfig:
    properties:
      showLabels:
        type: boolean
      showTraitBars:
        type: boolean
    type: object
  models.MilkyWayConfig:
    properties:
      allSkyStarCount:
        type: integer
      bandStarCount:
        type: integer
      bandTiltXRadians:
        type: number
      bandTiltZRadians:
        type: number
      coreCloudColors:
        items:
          $ref: '#/definitions/models.WeightedColor'
        type: array
      coreCloudCount:
        type: integer
      coreCloudOpacity:
        type: number
      coreStarColors:
        items:
          $ref: '#/definitions/models.WeightedColor'
        type: array
      coreStarCount:
        type: integer
      dustCloudColors:
        items:
          $ref: '#/definitions/models.WeightedColor'
        type: array
      dustCloudCount:
        type: integer
      dustCloudOpacity:
        type: number
      heroStarCount:
        type: integer
      nebulaCloudColors:
        items:
          $ref: '#/definitions/models.WeightedColor'
        type: array
      nebulaCloudCount:
        type: integer
      nebulaCloudOpacity:
        type: number
      rotationRadiansPerSecond:
        type: number
      seed:
        type: string
      starColors:
        items:
          $ref: '#/definitions/models.WeightedColor'
        type: array
    type: object
  models.Palette:
    properties:
      accent:
        type: string
      background:
        type: string
      gradient:
        items:
          type: string
        type: array
      primary:
        type: string
      secondary:
        type: string
    type: object
  models.ParticleConfig:
    properties:
      color:
        type: string
      desktopCount:
        type: integer
      mobileCount:
        type: integer
      spread:
        type: number
    type: object
  models.PersonalityDNA:
    properties:
      archetype:
        type: string
      energySignature:
        $ref: '#/definitions/models.EnergySignature'
      planets:
        items:
          $ref: '#/definitions/models.DNAPlanet'
        type: array
      quote:
        type: string
      sceneName:
        type: string
      schemaVersion:
        type: string
      shortNarrative:
        type: string
      traitScores:
        $ref: '#/definitions/models.TraitScores'
      visualHints:
        $ref: '#/definitions/models.VisualHints'
    type: object
  models.PlanetSceneConfig:
    properties:
      color:
        type: string
      energy:
        type: integer
      key:
        type: string
      meaning:
        type: string
      name:
        type: string
      orbitRadius:
        type: number
      orbitSpeed:
        type: number
      phase:
        type: number
      size:
        type: number
    type: object
  models.PostFXConfig:
    properties:
      bloomIntensity:
        type: number
    type: object
  models.PublicDNA:
    properties:
      planets:
        items:
          $ref: '#/definitions/models.DNAPlanet'
        type: array
      traitScores:
        $ref: '#/definitions/models.TraitScores'
    type: object
  models.PublicVariant:
    properties:
      config:
        $ref: '#/definitions/models.WorldSceneConfig'
      seed:
        type: string
    type: object
  models.PublicWorld:
    properties:
      archetype:
        type: string
      nickname:
        type: string
      quote:
        type: string
      sceneName:
        type: string
      shortNarrative:
        type: string
    type: object
  models.PublicWorldResponse:
    properties:
      publicDNA:
        $ref: '#/definitions/models.PublicDNA'
      variant:
        $ref: '#/definitions/models.PublicVariant'
      world:
        $ref: '#/definitions/models.PublicWorld'
    type: object
  models.PublishResponse:
    properties:
      shareSlug:
        type: string
      shareUrl:
        type: string
    type: object
  models.SkyConfig:
    properties:
      constellations:
        $ref: '#/definitions/models.ConstellationConfig'
      milkyWay:
        $ref: '#/definitions/models.MilkyWayConfig'
    type: object
  models.TraitScores:
    properties:
      creativity:
        type: integer
      curiosity:
        type: integer
      discipline:
        type: integer
      energy:
        type: integer
      focus:
        type: integer
    type: object
  models.VariantResponse:
    properties:
      variant:
        $ref: '#/definitions/models.WorldVariant'
    type: object
  models.VisualHints:
    properties:
      coreSymbol:
        type: string
      motionIntent:
        type: string
      paletteIntent:
        type: string
      theme:
        type: string
    type: object
  models.WeightedColor:
    properties:
      color:
        type: string
      weight:
        type: number
    type: object
  models.World:
    properties:
      archetype:
        type: string
      createdAt:
        type: string
      id:
        type: string
      nickname:
        type: string
      quote:
        type: string
      role:
        type: string
      sceneName:
        type: string
      selectedVariantId:
        type: string
      shareSlug:
        type: string
      shortNarrative:
        type: string
      updatedAt:
        type: string
      visibility:
        type: string
    type: object
  models.WorldInput:
    properties:
      challenge:
        type: string
      favoriteColors:
        items:
          type: string
        type: array
      goal:
        type: string
      interests:
        items:
          type: string
        type: array
      mood:
        type: string
      nickname:
        type: string
      preferredWorldStyle:
        type: string
      role:
        type: string
      traits:
        items:
          type: string
        type: array
    type: object
  models.WorldListResponse:
    properties:
      worlds:
        items:
          $ref: '#/definitions/models.WorldResponse'
        type: array
    type: object
  models.WorldResponse:
    properties:
      personalityDNA:
        $ref: '#/definitions/models.PersonalityDNA'
      selectedVariant:
        $ref: '#/definitions/models.WorldVariant'
      variants:
        items:
          $ref: '#/definitions/models.WorldVariant'
        type: array
      world:
        $ref: '#/definitions/models.World'
    type: object
  models.WorldSceneConfig:
    properties:
      archetype:
        type: string
      camera:
        $ref: '#/definitions/models.CameraConfig'
      core:
        $ref: '#/definitions/models.CoreConfig'
      hud:
        $ref: '#/definitions/models.HUDConfig'
      palette:
        $ref: '#/definitions/models.Palette'
      particles:
        $ref: '#/definitions/models.ParticleConfig'
      planets:
        items:
          $ref: '#/definitions/models.PlanetSceneConfig'
        type: array
      postFX:
        $ref: '#/definitions/models.PostFXConfig'
      quote:
        type: string
      sceneName:
        type: string
      schemaVersion:
        type: string
      sky:
        allOf:
        - $ref: '#/definitions/models.SkyConfig'
        description: |-
          Sky was added in schemaVersion 1.1. Pointer + omitempty so configs stored
          before that keep round-tripping without a sky key; the frontend falls back
          to its built-in sky defaults when the key is absent.
      theme:
        type: string
    type: object
  models.WorldVariant:
    properties:
      config:
        $ref: '#/definitions/models.WorldSceneConfig'
      createdAt:
        type: string
      id:
        type: string
      isSelected:
        type: boolean
      seed:
        type: string
      thumbnailUrl:
        type: string
      variantNo:
        type: integer
      worldId:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for Myunivokai personal universe generation.
  title: Myunivokai API
  version: 0.1.0
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check (liveness)
      tags:
      - health
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Readiness check (dependencies)
      tags:
      - health
  /share/worlds/{shareSlug}:
    get:
      parameters:
      - description: Share slug
        in: path
        name: shareSlug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PublicWorldResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Get public universe
      tags:
      - share
  /worlds:
    get:
      parameters:
      - description: Comma-separated world IDs (max 50)
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorldListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Get universes by ids
      tags:
      - worlds
    post:
      consumes:
      - application/json
      parameters:
      - description: World input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/models.WorldInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.CreateWorldResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Create universe
      tags:
      - worlds
  /worlds/{worldId}:
    get:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.WorldResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Get universe
      tags:
      - worlds
  /worlds/{worldId}/publish:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PublishResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Publish universe
      tags:
      - worlds
  /worlds/{worldId}/variants:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.VariantResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Regenerate universe variant
      tags:
      - worlds
  /worlds/{worldId}/variants/{variantId}/select:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      - description: Variant ID
        in: path
        name: variantId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.VariantResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorEnvelope'
      summary: Select universe variant
      tags:
      - worlds
swagger: "2.0"
