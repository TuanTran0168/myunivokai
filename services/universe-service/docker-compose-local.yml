services:
  postgres:
    image: postgres:17-alpine
    container_name: myunivokai-postgres
    environment:
      POSTGRES_USER: myunivokai
      POSTGRES_PASSWORD: myunivokai
      POSTGRES_DB: myunivokai
    ports:
      - "5432:5432"
    volumes:
      - myunivokai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myunivokai -d myunivokai"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
    container_name: myunivokai-migrate
    volumes:
      - ./.env.local:/app/.env.local:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/migrate"]
    restart: "no"

  api:
    build:
      context: .
    container_name: myunivokai-api
    volumes:
      - ./.env.local:/app/.env.local:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  myunivokai-postgres-data:
