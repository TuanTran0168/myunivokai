services:
  universe-migrate:
    build:
      context: ../..
      dockerfile: services/universe-service/Dockerfile.local
    command: ["go", "run", "./cmd/migrate"]
    environment:
      DATABASE_URL: postgresql://${UNIVERSE_DATABASE_USER:-myunivokai_universe_app}:${UNIVERSE_DATABASE_PASSWORD:-myunivokai_local_universe}@postgres:5432/${UNIVERSE_DATABASE_NAME:-myunivokai_universe}?sslmode=disable
      DATABASE_DIRECT_URL: postgresql://${UNIVERSE_DATABASE_USER:-myunivokai_universe_app}:${UNIVERSE_DATABASE_PASSWORD:-myunivokai_local_universe}@postgres:5432/${UNIVERSE_DATABASE_NAME:-myunivokai_universe}?sslmode=disable
      MIGRATIONS_DIR: /workspace/services/universe-service/migrations
    volumes:
      - ../..:/workspace
      - universe-service-go-cache:/go/pkg/mod
    restart: on-failure
    networks: [backend]

  universe-service:
    build:
      context: ../..
      dockerfile: services/universe-service/Dockerfile.local
    environment:
      APP_ENV: ${APP_ENV:-development}
      PUBLIC_WEB_URL: http://localhost:${WEB_PORT:-3000}
      DATABASE_URL: postgresql://${UNIVERSE_DATABASE_USER:-myunivokai_universe_app}:${UNIVERSE_DATABASE_PASSWORD:-myunivokai_local_universe}@postgres:5432/${UNIVERSE_DATABASE_NAME:-myunivokai_universe}?sslmode=disable
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_USERNAME: ${NATS_UNIVERSE_USERNAME:-myunivokai_universe}
      NATS_PASSWORD: ${NATS_UNIVERSE_PASSWORD:-myunivokai_local_universe}
      NATS_ACK_WAIT: ${NATS_ACK_WAIT:-2m}
      NATS_MAX_DELIVER: ${NATS_MAX_DELIVER:-5}
      NATS_QUERY_TIMEOUT: ${NATS_QUERY_TIMEOUT:-2500ms}
      OUTBOX_POLL_INTERVAL: ${OUTBOX_POLL_INTERVAL:-500ms}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      SERVICE_SHUTDOWN_TIMEOUT: ${SERVICE_SHUTDOWN_TIMEOUT:-15s}
    volumes:
      - ../..:/workspace
      - universe-service-go-cache:/go/pkg/mod
    depends_on:
      universe-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "sh", "-c", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
    name: myunivokai-local-backend

volumes:
  universe-service-go-cache:
