services:
  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile.local
    env_file:
      - ./.env.local
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: Myunivokai API Gateway
      API_HOST: 0.0.0.0
      API_PORT: 41800
      API_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-41300}
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      NATS_USERNAME: ${NATS_GATEWAY_USERNAME:-myunivokai_gateway}
      NATS_PASSWORD: ${NATS_GATEWAY_PASSWORD:-myunivokai_local_gateway}
      NATS_REQUEST_TIMEOUT: ${NATS_REQUEST_TIMEOUT:-3s}
      NATS_PUBLISH_TIMEOUT: ${NATS_PUBLISH_TIMEOUT:-5s}
      NATS_CONNECT_TIMEOUT: ${NATS_CONNECT_TIMEOUT:-5s}
      NATS_RECONNECT_WAIT: ${NATS_RECONNECT_WAIT:-2s}
      REDIS_URL: ${REDIS_URL:-redis://:myunivokai_local_redis@redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-myunivokai}
      RATE_LIMIT_REQUESTS_PER_SECOND: ${RATE_LIMIT_REQUESTS_PER_SECOND:-2}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-20}
      # /api/admin is off by default in production until apps/myunivokai-admin
      # exists (S4-AUTH-004); local dev turns it on so the route group and its
      # tests actually run against a live stack. See
      # notes/vision/auth-and-admin-plan.md#amended--one-gateway-two-route-groups.
      ADMIN_ROUTES_ENABLED: ${ADMIN_ROUTES_ENABLED:-true}
      ADMIN_ALLOWED_ORIGIN: http://localhost:${ADMIN_PORT:-41900}
      ADMIN_RATE_LIMIT_REQUESTS_PER_SECOND: ${ADMIN_RATE_LIMIT_REQUESTS_PER_SECOND:-10}
      ADMIN_RATE_LIMIT_BURST: ${ADMIN_RATE_LIMIT_BURST:-50}
      # Public half of AUTH_ACCESS_PRIVATE_KEY (auth-service/.env.local) —
      # never the private key itself. Comma-separated so a key-rotation
      # drill can list both the outgoing and incoming key at once (S4-AUTH-005).
      ADMIN_ACCESS_PUBLIC_KEYS: ${ADMIN_ACCESS_PUBLIC_KEYS}
      ADMIN_TOKEN_VERSION_CACHE_TTL: ${ADMIN_TOKEN_VERSION_CACHE_TTL:-360h}
      JOB_CACHE_TTL: ${JOB_CACHE_TTL:-30s}
      WORLD_CACHE_TTL: ${WORLD_CACHE_TTL:-60s}
      SHARE_CACHE_TTL: ${SHARE_CACHE_TTL:-60s}
      SERVICE_SHUTDOWN_TIMEOUT: ${SERVICE_SHUTDOWN_TIMEOUT:-15s}
    ports:
      - "${GATEWAY_PORT:-41800}:41800"
    volumes:
      - ../..:/workspace
      - api-gateway-go-cache:/go/pkg/mod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://localhost:41800/api/v1/readyz"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped
    networks: [edge, backend]

networks:
  edge:
    name: myunivokai-local-edge
  backend:
    name: myunivokai-local-backend

volumes:
  api-gateway-go-cache:
