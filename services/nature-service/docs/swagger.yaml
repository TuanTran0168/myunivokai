info:
  contact: {}
  description: Backend API for Myunivokai personal forest generation.
  title: Myunivokai Nature API
  version: 0.1.0
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check (liveness)
      tags:
      - health
  /readyz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties: true
            type: object
      summary: Readiness check (dependencies)
      tags:
      - health
  /share/worlds/{shareSlug}:
    get:
      parameters:
      - description: Share slug
        in: path
        name: shareSlug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_models.PublicWorldResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
      summary: Get public forest world
      tags:
      - share
  /worlds:
    get:
      parameters:
      - description: Comma-separated world IDs (max 50)
        in: query
        name: ids
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_models.WorldListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
      summary: Get forest worlds by ids
      tags:
      - worlds
    post:
      consumes:
      - application/json
      parameters:
      - description: World input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_models.WorldInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_models.CreateWorldResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
      summary: Create forest world
      tags:
      - worlds
  /worlds/{worldId}:
    get:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_models.WorldResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
      summary: Get forest world
      tags:
      - worlds
  /worlds/{worldId}/publish:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_models.PublishResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
      summary: Publish forest world
      tags:
      - worlds
  /worlds/{worldId}/variants:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_models.VariantResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
      summary: Regenerate forest variant
      tags:
      - worlds
  /worlds/{worldId}/variants/{variantId}/select:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      - description: Variant ID
        in: path
        name: variantId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_models.VariantResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_services_nature-service_internal_httpx.ErrorEnvelope'
      summary: Select forest variant
      tags:
      - worlds
swagger: "2.0"
