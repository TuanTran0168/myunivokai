services:
  myunivokai-web:
    build:
      context: .
      dockerfile: Dockerfile.local
    env_file:
      - ./.env.local
    environment:
      NEXT_PUBLIC_GATEWAY_BASE_URL: ${NEXT_PUBLIC_GATEWAY_BASE_URL:-http://localhost:41800}
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-41300}:41300"
    volumes:
      - .:/app
      - myunivokai-web-node-modules:/app/node_modules
      - myunivokai-web-next-cache:/app/.next
    restart: unless-stopped
    networks: [edge]

networks:
  edge:
    name: myunivokai-local-edge

volumes:
  myunivokai-web-node-modules:
  myunivokai-web-next-cache:
