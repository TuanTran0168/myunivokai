info:
  contact: {}
  description: Backend API for Myunivokai personal universe generation.
  title: Myunivokai API
  version: 0.1.0
paths:
  /healthz:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Health check
      tags:
      - health
  /share/worlds/{shareSlug}:
    get:
      parameters:
      - description: Share slug
        in: path
        name: shareSlug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_models.PublicWorldResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
      summary: Get public universe
      tags:
      - share
  /worlds:
    post:
      consumes:
      - application/json
      parameters:
      - description: World input
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_models.WorldInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_models.CreateWorldResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
      summary: Create universe
      tags:
      - worlds
  /worlds/{worldId}:
    get:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_models.WorldResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
      summary: Get universe
      tags:
      - worlds
  /worlds/{worldId}/publish:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_models.PublishResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
      summary: Publish universe
      tags:
      - worlds
  /worlds/{worldId}/variants:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_models.VariantResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
      summary: Regenerate universe variant
      tags:
      - worlds
  /worlds/{worldId}/variants/{variantId}/select:
    post:
      parameters:
      - description: World ID
        in: path
        name: worldId
        required: true
        type: string
      - description: Variant ID
        in: path
        name: variantId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_models.VariantResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_myunivokai_myunivokai_apps_api_internal_httpx.ErrorEnvelope'
      summary: Select universe variant
      tags:
      - worlds
swagger: "2.0"
